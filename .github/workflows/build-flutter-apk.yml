name: 📱 Build mail-flutter APK

on:
  push:
    branches: [main]
    paths:
      - "mail-flutter/**"
      - ".github/workflows/build-flutter-apk.yml"
  pull_request:
    paths:
      - "mail-flutter/**"
      - ".github/workflows/build-flutter-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mail-flutter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mail-flutter/android/**/*.gradle*
            mail-flutter/android/gradle/wrapper/gradle-wrapper.properties

      # 固定与 pubspec (sdk ^3.8.0) 兼容的 Flutter 版本
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true
          pub-cache: true

      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/ci-keystore.jks
            test -s android/app/ci-keystore.jks
            echo "Using CI keystore"
          else
            echo "::warning::KEYSTORE_BASE64 未配置，使用默认 debug 签名（无法覆盖安装旧版本）"
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify and rename APK
        id: apk
        run: |
          set -euo pipefail
          SRC=build/app/outputs/flutter-apk/app-debug.apk
          if [ ! -s "$SRC" ]; then
            echo "::error::APK 不存在或为空: $SRC"
            exit 1
          fi
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          DEST=build/app/outputs/flutter-apk/CloudMail-v${VER}-debug.apk
          cp "$SRC" "$DEST"
          ls -l "$DEST"
          echo "path=mail-flutter/$DEST" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: CloudMail-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
