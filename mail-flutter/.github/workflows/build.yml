name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/ci-keystore.jks

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          cp build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/CloudMail-v${VER}-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CloudMail-apk
          path: build/app/outputs/flutter-apk/CloudMail-v*-debug.apk
